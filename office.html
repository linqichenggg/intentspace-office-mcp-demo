<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntentSpace</title><link rel="stylesheet" href="/office.css"></head>
<body>
<a class="skip" href="#intent" data-i18n="planLabel"></a>
<div class="workbench">
<header class="appHeader wood">
  <a class="brand" href="/office.html"><span class="brandMark" aria-hidden="true">❖</span><span>IntentSpace</span></a>
  <span class="demoBadge" data-i18n="simulation"></span>
  <nav class="roleSwitch" aria-label="View"><a href="/office.html" id="employeeLink" data-i18n="employee"></a><a href="/admin" id="adminLink" data-i18n="admin"></a></nav>
  <div class="headerActions"><select id="language" data-label="language"><option value="ja">日本語</option><option value="en">English</option></select><button id="openSettings" data-i18n="settings"></button><button id="openHelp" data-i18n="help"></button></div>
</header>
<div class="noticeRow"><div id="notice" class="notice" role="status" aria-live="polite"></div><button id="errorDetails" class="subtle" data-i18n="errorDetails" hidden></button></div>
<nav id="mobileTabs" class="mobileTabs" aria-label="Workspace"><button data-pane="plan" data-i18n="dayPlan"></button><button data-pane="map" data-i18n="mapTitle"></button><button data-pane="agenda" data-i18n="agenda"></button></nav>
<main id="employeeView" class="employeeGrid">
  <section class="planPane wood" data-mobile-pane="plan">
    <div class="sectionTitle"><span class="avatar">A</span><h1 data-i18n="planTitle"></h1></div>
    <p class="intro" data-i18n="planHint"></p>
    <button id="openCalendar" class="calendarEntry" data-i18n="calendarOpen"></button>
    <form id="intentForm" class="planForm">
      <label><span data-i18n="planSourceLabel"></span><select id="planSource" data-label="planSourceLabel"><option value="manual" data-i18n="sourceManual"></option><option value="calendar" data-i18n="sourceCalendar"></option></select></label>
      <div id="calendarExportControls" class="calendarExportControls" hidden><button type="button" id="calendarRangeToggle" class="subtle" hidden></button><div class="editGrid"><label><span data-i18n="startDate"></span><input id="calendarExportStart" type="date"></label><label><span data-i18n="endDate"></span><input id="calendarExportEnd" type="date"></label></div><button type="button" id="exportCalendar" data-i18n="calendarExport"></button><p class="small" data-i18n="calendarExportWindow"></p></div>
      <label id="homePlanLabel" for="intent" data-i18n="planLabel"></label>
      <textarea id="intent" maxlength="4000" data-placeholder="planPlaceholder" required></textarea>
      <label id="calendarSupplementLabel" hidden><span data-i18n="calendarSupplement"></span><input id="calendarSupplement" maxlength="1200" data-placeholder="calendarSupplementHint"></label>
      <p id="calendarImportStatus" class="small" role="status" hidden></p>
      <div class="row"><button type="button" id="calendarTrace" hidden data-i18n="calendarTrace"></button></div>
      <div class="row"><button type="button" id="useExample" class="subtle" data-i18n="example"></button><span id="keyBadge" class="keyBadge"></span></div>
      <button id="parseButton" class="primary" data-i18n="analyse"></button>
    </form>
    <p class="small" data-i18n="modeHelp"></p>
    <div class="responsibility"><span class="ori" aria-hidden="true">▣</span><p data-i18n="gptUse"></p></div>
    <div class="dayReference"><span data-i18n="currentDate"></span><time id="today"></time></div>
  </section>
  <section class="worldPane" data-mobile-pane="map">
    <div class="mapHeader wood"><h2 data-i18n="mapTitle"></h2><div><span data-i18n="simClock"></span> <time id="worldClock"></time></div></div>
    <div class="layoutWorkspace">
      <nav class="layoutTabs" aria-label="TSG 9F"><button data-area="meeting" data-i18n="zoneMeeting"></button><button data-area="east" data-i18n="zoneEast"></button><button data-area="west" data-i18n="zoneWest"></button><button data-area="connect">CONNECT</button></nav>
      <div class="layoutLegend"><span class="legendFree" data-i18n="mapFree"></span><span class="legendCandidate" data-i18n="candidate"></span><span class="legendBusy" data-i18n="in_progress"></span><span class="legendUnknown" data-i18n="mapUnknown"></span><button id="layoutInfo" class="subtle" data-i18n="layoutSource"></button></div>
      <div class="officeMap realLayout" id="officeMap">
        <div id="layoutStage" class="layoutStage">
          <svg id="layoutSvg" class="layoutSvg" aria-label="TSG 9F"></svg>
          <svg class="route" id="layoutRoute" aria-hidden="true"><path id="route" d=""></path></svg>
          <div class="pixelPerson" id="personA" style="--x:10%;--y:85%"><i class="pixelHead"></i><i class="pixelBody"></i><i class="pixelLegs"></i><span class="personLabel">A</span><span class="personState" id="stateA"></span></div>
        </div>
      </div>
      <div class="layoutBottom"><p id="layoutCaption"></p><button id="legacySeat" class="subtle"></button></div>
    </div>
    <div class="dayStrip wood"><span id="mapStatus"></span><button id="showEvents" class="subtle" data-i18n="showEvents"></button></div>
  </section>
  <section class="agendaPane wood" data-mobile-pane="agenda">
    <div class="sectionTitle"><span class="ori" aria-hidden="true">▣</span><h2 data-i18n="agenda"></h2></div>
    <nav class="agendaTabs"><button id="proposalsTab" data-i18n="proposals"></button><button id="bookingsTab" data-i18n="bookings"></button><button id="historyTab" data-i18n="bookingHistory"></button></nav>
    <div id="agendaContent" class="agendaContent" aria-live="polite"></div>
    <div class="pager"><button id="agendaPrevious" data-i18n="previous"></button><span id="agendaPage"></span><button id="agendaNext" data-i18n="next"></button></div>
  </section>
</main>
<main id="adminView" class="adminGrid" hidden>
  <nav class="adminNav wood" aria-label="Admin sections">
    <h1 data-i18n="admin"></h1>
    <button data-admin="live" data-i18n="live"></button><button data-admin="summary" data-i18n="summary"></button><button data-admin="spaces" data-i18n="spaces"></button><button data-admin="reservations" data-i18n="reservations"></button><button data-admin="review" data-i18n="review"></button><button data-admin="ai" data-i18n="ai"></button>
    <button data-admin="comfort" data-i18n="comfort"></button>
    <button data-admin="improvements" data-i18n="improvements"></button>
    <a href="/history" data-i18n="historySamples"></a>
    <p class="small" data-i18n="boundary"></p>
  </nav>
  <section class="adminMain wood">
    <div class="sectionTitle"><h2 id="adminTitle"></h2><div class="row"><button id="adminClear" class="danger" data-i18n="bulkClear"></button><button id="adminBulkPurge" class="danger" data-i18n="bulkPurge"></button><button id="adminRefresh" data-i18n="refresh"></button></div></div>
    <p id="adminDescription" class="small"></p>
    <div id="adminMetrics" class="metrics"></div>
    <form id="liveQuery" class="adminQuery liveQuery" hidden>
      <label><span data-i18n="startDate"></span><input id="liveStart" type="date"></label>
      <label><span data-i18n="endDate"></span><input id="liveEnd" type="date"></label>
      <label><span data-i18n="room"></span><select id="liveRoom"></select></label>
      <label><span data-i18n="state"></span><select id="liveState"><option value="all" data-i18n="allStates"></option><option value="not_deleted" data-i18n="notDeleted"></option><option value="reserved" data-i18n="reserved"></option><option value="attending" data-i18n="attending"></option><option value="in_progress" data-i18n="in_progress"></option><option value="completed" data-i18n="completed"></option><option value="cancelled" data-i18n="cancelled"></option><option value="deleted" data-i18n="deleted"></option></select></label>
      <label><span data-i18n="keyword"></span><input id="liveSearch" maxlength="160"></label>
      <button type="button" id="clearFilters" data-i18n="clearFilters"></button><button type="button" id="adminCreate" class="primary" data-i18n="newReservation"></button>
    </form>
    <form id="adminQuery" class="adminQuery" hidden>
      <label id="startLabel"><span data-i18n="startDate"></span><input id="historyStart" type="date"></label>
      <label id="endLabel"><span data-i18n="endDate"></span><input id="historyEnd" type="date"></label>
      <label id="searchLabel" hidden><span data-i18n="search"></span><input id="spaceSearch" maxlength="100"></label>
      <label class="reviewFilter" hidden><span data-i18n="minimum"></span><input id="minBookings" type="number" min="1" max="100000" step="1" value="2" required></label>
      <label class="reviewFilter" hidden><span data-i18n="unusedMin"></span><input id="minUnused" type="number" min="1" max="100000" step="1" value="1" required></label>
      <label class="reviewFilter" hidden><span data-i18n="percent"></span><input id="minPercent" type="number" min="0" max="100" step="0.1" value="50" required></label>
      <span class="small" data-i18n="autoFilters"></span>
    </form>
    <div id="reviewTools" class="row" hidden><button id="reviewDemo" data-i18n="reviewDemo"></button><span id="comparisonStatus"></span></div>
    <div id="comfortControls" class="row" hidden><button id="comfortThermal" data-i18n="comfortThermal"></button><button id="comfortSurvey" data-i18n="comfortSurvey"></button></div>
    <p id="comfortPeriod" class="small" hidden></p>
    <form id="improvementForm" class="improvementForm" hidden>
      <label><span data-i18n="startDate"></span><input id="improvementStart" type="date" required></label>
      <label><span data-i18n="endDate"></span><input id="improvementEnd" type="date" required></label>
      <button id="improvementAnalyze" type="submit" class="primary" data-i18n="improvementAnalyze"></button>
      <span id="improvementRunStatus" class="small" role="status"></span>
    </form>
    <div id="adminResults" class="adminResults"></div>
    <form id="adminAskForm" class="adminAsk" hidden><label for="adminQuestion" data-i18n="adminAi"></label><textarea id="adminQuestion" maxlength="2000" data-placeholder="askHint" required></textarea><button class="primary" data-i18n="send"></button></form>
    <div class="adminBottom"><div class="pager"><button id="adminPrevious" data-i18n="previous"></button><span id="adminPage"></span><button id="adminNext" data-i18n="next"></button></div><button id="adminTrace" data-i18n="raw"></button></div>
  </section>
</main>
<footer class="appFooter"><span data-i18n="footer"></span><button id="limitsButton" class="subtle" data-i18n="help"></button></footer>
</div>
<dialog id="settingsDialog" class="wood"><div class="dialogHeader"><h2 data-i18n="connectionTitle"></h2><button data-close="settingsDialog" data-i18n="close"></button></div><form id="keyForm" autocomplete="off"><label><span data-i18n="model"></span><input id="model" value="gpt-4.1-mini" maxlength="95" required></label><label><span data-i18n="key"></span><input id="key" type="password" autocomplete="off" maxlength="256" required></label><div class="row"><button class="primary" data-i18n="configure"></button><button type="button" id="clearKey" data-i18n="clear"></button></div></form><p id="keyStatus" role="status"></p><p class="small" data-i18n="privacy"></p></dialog>
<dialog id="detailDialog" class="wood"><div class="dialogHeader"><h2 id="detailTitle"></h2><button data-close="detailDialog" data-i18n="close"></button></div><pre id="detailText"></pre><div class="pager"><button id="detailPrevious" data-i18n="previous"></button><span id="detailPage"></span><button id="detailNext" data-i18n="next"></button></div></dialog>
<dialog id="editDialog" class="wood"><div class="dialogHeader"><h2 data-i18n="edit"></h2><button data-close="editDialog" data-i18n="close"></button></div><form id="editForm"><label><span data-i18n="title"></span><input id="editTitle" maxlength="160" required></label><div class="editGrid"><label><span data-i18n="date"></span><input id="editDate" type="date" required></label><label><span data-i18n="people"></span><input id="editPeople" type="number" min="1" max="100" required></label><label><span data-i18n="duration"></span><input id="editDuration" type="number" min="15" max="480" required></label><label><span data-i18n="time"></span><select id="editMode"><option value="exact" data-i18n="exact"></option><option value="flexible" data-i18n="flexible"></option></select></label><label id="editTimeLabel"><span data-i18n="time"></span><input id="editTime" type="time"></label><label class="windowEdit"><span data-i18n="windowStart"></span><input id="editEarliest" type="time"></label><label class="windowEdit"><span data-i18n="windowEnd"></span><input id="editLatest" type="time"></label></div><fieldset id="editFeatures"><legend data-i18n="features"></legend></fieldset><p id="editStatus" class="formStatus" role="status"></p><button class="primary" data-i18n="save"></button></form></dialog>
<dialog id="calendarDialog" class="wood calendarDialog" aria-labelledby="calendarHeading">
  <div class="dialogHeader"><div><p class="roomEyebrow" data-i18n="calendarSimulated"></p><h2 id="calendarHeading" data-i18n="calendarOpen"></h2></div><button data-close="calendarDialog" data-i18n="close"></button></div>
  <section id="calendarMonthView" class="calendarMonthView">
    <div class="calendarMonthHeading"><h3 id="calendarMonthTitle" aria-live="polite"></h3><nav class="row" data-label="calendarMonthNavigation"><button id="calendarPreviousMonth" data-label="calendarPreviousMonth">‹</button><button id="calendarThisMonth" data-i18n="calendarToday"></button><button id="calendarNextMonth" data-label="calendarNextMonth">›</button></nav></div>
    <div id="calendarWeekdays" class="calendarWeekdays" aria-hidden="true"></div>
    <div id="calendarMonthGrid" class="calendarMonthGrid" role="group" data-label="calendarMonthDates"></div>
  </section>
  <section id="calendarDayView" class="calendarDayView" hidden>
  <div class="calendarDayHeading"><button id="calendarBackMonth" class="subtle" data-i18n="calendarBackMonth"></button><h3 id="calendarSelectedDay"></h3></div>
  <p id="calendarBookingWindow" class="small" data-i18n="calendarRecordOnly" hidden></p>
  <div class="calendarToolbar"><label><span data-i18n="date"></span><input id="calendarDate" type="date" min="1900-01-01" max="2100-12-31" required></label><button id="calendarExamples" data-i18n="calendarExamples"></button><button id="calendarNew" data-i18n="calendarNew"></button></div>
  <div class="calendarBody"><section class="calendarTimeline" data-label="calendarSchedule"><div id="calendarList"></div></section>
    <form id="calendarEditForm" class="calendarEditor"><h3 id="calendarEditorTitle" data-i18n="calendarNew"></h3>
      <label><span data-i18n="title"></span><input id="calendarTitle" maxlength="160" required></label>
      <div class="editGrid"><label><span data-i18n="time"></span><input id="calendarTime" type="time" min="00:00" max="23:44" value="09:00" required></label><label><span data-i18n="calendarEnd"></span><input id="calendarEnd" type="time" min="00:15" max="23:59" value="10:00" required></label></div>
      <label><span data-i18n="calendarPeople"></span><input id="calendarPeople" type="number" min="1" max="100"></label>
      <label><span data-i18n="calendarNotes"></span><textarea id="calendarNotes" maxlength="1200" rows="3" data-placeholder="calendarNotesHint"></textarea></label>
      <p id="calendarLinked" class="small"></p>
      <div class="row"><button id="calendarSave" class="primary" data-i18n="calendarSave"></button><button id="calendarDiscard" type="button" data-i18n="calendarDiscard"></button><button id="calendarCancel" type="button" class="danger" hidden data-i18n="calendarCancel"></button></div>
    </form>
  </div>
  </section>
  <div class="calendarFooter"><p id="calendarStatus" class="small" role="status" aria-live="polite"></p><button type="button" id="calendarToHome" data-i18n="calendarToHome"></button></div>
</dialog>
<script type="module" src="/office.js"></script>
<dialog id="attendanceDialog" class="wood"><div class="dialogHeader"><h2 data-i18n="notMyBooking"></h2><button data-close="attendanceDialog" data-i18n="close"></button></div>
  <form id="attendanceForm"><p id="attendanceSummary" class="small"></p><p class="small" data-i18n="attendanceHint"></p>
    <label><span data-i18n="actualRoom"></span><select id="attendanceRoom" required></select></label>
    <label><span data-i18n="actualStart"></span><input id="attendanceTime" type="time" min="09:00" max="17:45" required></label>
    <p id="attendanceStatus" class="formStatus" role="status"></p><button class="primary" data-i18n="registerAttendance"></button>
  </form>
</dialog>
<dialog id="adminEditDialog" class="wood"><div class="dialogHeader"><h2 id="adminEditTitle"></h2><button data-close="adminEditDialog" data-i18n="close"></button></div>
  <form id="adminEditForm"><label><span data-i18n="title"></span><input id="adminMeetingTitle" maxlength="160" required></label>
    <div class="editGrid">
      <label><span data-i18n="date"></span><input id="adminDate" type="date" required></label><label><span data-i18n="time"></span><input id="adminTime" type="time" min="09:00" max="17:45" required></label>
      <label><span data-i18n="duration"></span><input id="adminDuration" type="number" min="15" max="480" step="1" required></label><label><span data-i18n="people"></span><input id="adminPeople" type="number" min="1" max="100" step="1" required></label>
      <label><span data-i18n="room"></span><select id="adminRoom" required></select></label><label><span data-i18n="bookedBy"></span><input id="adminBookedBy" maxlength="80" required></label>
      <label><span data-i18n="assignedTo"></span><select id="adminAssigned"><option value="other" data-i18n="otherBooking"></option><option value="A" data-i18n="employeeA"></option></select></label>
    </div>
    <fieldset id="adminFeatures"><legend data-i18n="features"></legend></fieldset>
    <p id="adminEditStatus" class="formStatus" role="status"></p><button class="primary" data-i18n="saveReservation"></button>
  </form><p class="small" data-i18n="adminWriteBoundary"></p>
</dialog>
<dialog id="adminDeleteDialog" class="wood"><div class="dialogHeader"><h2 id="adminDeleteTitle"></h2><button data-close="adminDeleteDialog" data-i18n="close"></button></div><p id="adminDeleteSummary"></p><p id="adminDeleteHint" class="small"></p><label id="adminPurgeAgreement" class="clearAgreement" hidden><input id="adminPurgeAgree" type="checkbox"><span data-i18n="purgeAgree"></span></label><p id="adminDeleteStatus" class="formStatus" role="status"></p><div class="row"><button data-close="adminDeleteDialog" data-i18n="close"></button><button id="adminDeleteConfirm" class="primary"></button></div></dialog>
<dialog id="roomDialog" class="wood roomDialog" aria-labelledby="roomDetailTitle">
  <div class="dialogHeader"><div><p class="roomEyebrow" data-i18n="roomFacilities"></p><h2 id="roomDetailTitle"></h2></div><button data-close="roomDialog" data-i18n="close"></button></div>
  <div class="roomOverview"><span id="roomCapacity" class="roomCapacity"></span><span id="roomAvailability" class="roomAvailability"></span></div>
  <p id="roomDemoNote" class="roomDemoNote"></p>
  <ul id="roomFacilityList" class="roomFacilityList"></ul>
  <p id="roomComfort" class="roomDemoNote" hidden></p>
  <section class="roomSchedule" aria-labelledby="roomScheduleTitle"><div class="roomScheduleHeading"><h3 id="roomScheduleTitle" data-i18n="roomSchedule"></h3><time id="roomScheduleDate"></time></div><div id="roomBookingList"></div>
    <div id="roomBookingPager" class="pager"><button id="roomBookingPrevious" data-i18n="previous"></button><span id="roomBookingPage"></span><button id="roomBookingNext" data-i18n="next"></button></div>
  </section>
</dialog>
<dialog id="bulkClearDialog" class="wood" aria-labelledby="bulkClearTitle">
  <div class="dialogHeader"><h2 id="bulkClearTitle" data-i18n="bulkClear"></h2><button data-close="bulkClearDialog" data-i18n="close"></button></div>
  <form id="bulkClearForm">
    <label><span data-i18n="clearRange"></span><select id="bulkRange"><option value="today" data-i18n="clearToday"></option><option id="bulkHour" value="hour" data-i18n="clearHour"></option><option value="week" data-i18n="clearWeek"></option><option value="month" data-i18n="clearMonth"></option><option value="all" data-i18n="clearAll"></option></select></label>
    <p id="bulkClearBasis" class="small"></p><p id="bulkClearPeriod" class="small"></p>
    <div id="bulkClearCounts" class="clearCounts"></div>
    <p id="bulkClearBoundary" class="small"></p>
    <label class="clearAgreement"><input type="checkbox" id="bulkClearAgree"><span id="bulkClearAgreement"></span></label>
    <p id="bulkClearStatus" class="formStatus" role="status"></p>
    <div class="row"><button type="button" id="bulkClearPreview" data-i18n="clearPreview"></button><button type="submit" id="bulkClearConfirm" class="danger" disabled data-i18n="clearConfirm"></button></div>
  </form>
</dialog>
</body></html>
